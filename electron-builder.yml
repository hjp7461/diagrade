# electron-builder 설정. PRD-001 §10 M7.
#
# 정책:
#   - 코드 서명 / Notarization 비활성 (PRD §9 비범위, v1.0).
#     사용자는 macOS 의 "확인되지 않은 개발자" 경고를 수동 우회.
#   - 자동 업데이트 비활성 (PRD §9). electron-updater 미적용.
#   - asar: true (default) — 단일 archive 로 성능 + 부분 보호.
#   - production dependencies 가 package.json 에 0 개라 node_modules 거의 미포함.
#     electron-vite 가 모든 의존성을 out/ 으로 번들했기 때문.

appId: com.diagrade.app
productName: Diagrade
copyright: Diagrade contributors

# v1.0 범위에선 자동 release 발행 비활성 (PRD-001 §9: 자동 업데이트 미적용).
# CI 가 builder 의 자동 GitHub publish 를 시도하지 않도록 명시 — GH_TOKEN 요구로 실패하는 것 방지.
publish: null

directories:
  # M1 의 .gitignore 가 release/ 를 제외 (산출물 커밋 금지 — pitfall #12).
  output: release
  # 아이콘 / DMG 배경 등 빌드 리소스. assets/icons 안에 들어감.
  buildResources: assets

# electron-vite 의 출력만 패키지에 포함. node_modules 는 production deps 가 없어 거의 비어있음.
files:
  - out/**/*
  - package.json
  - "!**/{.eslintrc*,.prettierrc*,*.map,*.test.*,__tests__,tests}"

# 런타임에서 BrowserWindow.icon 등으로 참조할 수 있도록 아이콘을 resources 에 포함.
# 포장된 앱에서 process.resourcesPath/icon.png 로 접근.
extraResources:
  - from: assets/icon.png
    to: icon.png

asar: true

# ---------- macOS (DMG) ----------
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: assets/icon.png
  # 코드 서명 비활성. identity: null 이 명시적 opt-out.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  # 단순 DMG 레이아웃. 아이콘 위치는 표준 좌·우 배치.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------- Windows (NSIS) ----------
win:
  target:
    - target: nsis
      arch: x64
  icon: assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false

# ---------- Linux (AppImage) ----------
linux:
  target:
    - target: AppImage
      arch: x64
  category: Office
  icon: assets/icon.png
  # AppImage 는 자체 desktop 항목 사용. category 만 명시.

# 아이콘 정책:
# - assets/icon.png (1024×1024) 한 파일이 모든 OS 의 아이콘 소스. electron-builder 가 빌드 시
#   .icns / .ico 로 자동 변환.
# - 사용자 정의 아이콘은 assets/icon.png 파일을 동일 크기로 덮어쓰면 자동 반영.
# - 기본 PNG 가 없을 때 재생성: `node scripts/generate-default-icon.mjs --force`.
# - 첫 빌드 후 release/ 디렉터리에 산출물 생성. .gitignore 제외 대상.
