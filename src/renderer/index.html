<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      PRD-001 §SEC-07
      Tailwind 도입 시 'unsafe-inline' style-src 의 적정성 재검토.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' diagrade-asset: data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Diagrade</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
