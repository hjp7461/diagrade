# Dependabot 자동 의존성 갱신.
# - npm 패키지: weekly, minor/patch 그룹화 (PR 폭주 방지).
#   major 는 별도 PR — breaking change 검토 필요.
# - GitHub Actions: weekly, 최신 SHA 로 핀.
# 보안 업데이트는 schedule 무시하고 즉시 PR 생성 (GitHub 기본).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      # 무거운 빌드 도구류 (electron-builder, electron, vite) 는 따로 — major 영향 큼.
      tooling:
        applies-to: version-updates
        patterns:
          - "electron"
          - "electron-builder"
          - "electron-vite"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
      # 마크다운 / mermaid / shiki 류 라이브러리.
      libraries:
        applies-to: version-updates
        patterns:
          - "markdown-it"
          - "markdown-it-*"
          - "mermaid"
          - "shiki"
          - "dompurify"
          - "chokidar"
        update-types:
          - "minor"
          - "patch"
      # 타입 / lint / 테스트 dev tooling.
      dev-tooling:
        applies-to: version-updates
        patterns:
          - "@types/*"
          - "typescript*"
          - "eslint*"
          - "prettier"
          - "vitest"
          - "@playwright/*"
          - "jsdom"
          - "@eslint/*"
          - "globals"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
